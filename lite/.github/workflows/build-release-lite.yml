name: Build & Release FT PDF Lite

on:
  push:
    tags: [ "v*-lite", "lite-v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies
      run: dotnet restore lite/FtPdfLite.csproj

    - name: Build Application
      run: dotnet build lite/FtPdfLite.csproj -c Release --no-restore

    - name: Publish Windows Standalone Executable
      run: |
        dotnet publish lite/FtPdfLite.csproj -c Release -r win-x64 --self-contained false -o ./publish-lite

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FT-PDF-Lite-Windows-x64
        path: ./publish-lite/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish-lite/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
