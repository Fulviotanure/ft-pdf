name: Release FT PDF

permissions:
  contents: write

on:
  push:
    paths:
      - 'ft-pdf/**'
      - '.github/workflows/release-ft-pdf.yml'
    tags:
      - 'v*'
      - 'ft-pdf-v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão do release (ex: v2.0.0)'
        required: false
        default: 'v2.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies (win-x64)
      run: dotnet restore ft-pdf/FtPdf.csproj -r win-x64

    - name: Build FT PDF
      run: dotnet build ft-pdf/FtPdf.csproj -c Release -r win-x64 --no-restore

    - name: Publish FT PDF (Standalone SingleFile)
      run: |
        dotnet publish ft-pdf/FtPdf.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --self-contained false -o ./publish-ft-pdf

    - name: Package Release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish-ft-pdf/* -DestinationPath ./FT-PDF-Windows-x64.zip -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FT-PDF-Windows-x64
        path: ./publish-ft-pdf/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || inputs.version_tag }}
        name: "FT PDF ${{ github.ref_name || inputs.version_tag }} (Edição Completa)"
        body: |
          ### 🚀 Release FT PDF - Edição Completa
          
          - **Leitor de PDF Vetorial Nativo** (Aceleração por Hardware)
          - **Múltiplas Abas Integradas**
          - **✍️ Caixa de Texto Interativa Flutuante** (Fundo Transparente, Bordas Pontilhadas, Quebra de Linha Integrada)
          - **Ferramentas de Edição:** Inserir Texto, Destaque, Assinatura Digital, Dividir, Mesclar e Girar
          - **🔍 Validação e Diagnóstico de Integridade**
          - **Ícone Clássico:** Monograma azul com facetas
          
          Baixe o executável abaixo para usar imediatamente!
        files: |
          ./publish-ft-pdf/FtPdf.exe
          ./FT-PDF-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
